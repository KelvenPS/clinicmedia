name: Deploy — Produção

on:
  push:
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema packages/backend/prisma/schema.prisma

      - name: Build backend (TypeScript)
        run: npm run build -w packages/backend

      - name: Build frontend (Vite)
        run: npm run build -w packages/frontend
        env:
          VITE_API_URL: http://${{ secrets.VPS_HOST }}/api

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: SSH — pull, build e restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR }}

            echo "==> Pulling latest from main..."
            git pull origin main

            echo "==> Building containers..."
            docker compose build --no-cache

            echo "==> Restarting services..."
            docker compose up -d --remove-orphans

            echo "==> Aguardando backend inicializar (30s)..."
            sleep 30

            echo "==> Health check..."
            curl -sf http://localhost/api/health || (echo "HEALTH CHECK FAILED" && docker compose logs backend --tail=50 && exit 1)

            echo "==> Deploy concluido com sucesso!"
            docker compose ps
