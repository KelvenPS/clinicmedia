services:
  postgres:
    image: postgres:16-alpine
    container_name: clinicmedia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinicuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicpass123}
      POSTGRES_DB: ${POSTGRES_DB:-clinicmedia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - clinicmedia_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinicuser} -d ${POSTGRES_DB:-clinicmedia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: clinicmedia_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-clinicuser}:${POSTGRES_PASSWORD:-clinicpass123}@postgres:5432/${POSTGRES_DB:-clinicmedia}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://${VPS_IP:-2.25.185.223}
      BACKEND_URL: http://${VPS_IP:-2.25.185.223}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clinicmedia_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://${VPS_IP:-2.25.185.223}/api
    container_name: clinicmedia_frontend
    restart: unless-stopped
    networks:
      - clinicmedia_network
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: clinicmedia_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - clinicmedia_network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data:

networks:
  clinicmedia_network:
    driver: bridge
